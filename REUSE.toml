# SPDX-License-Identifier: MIT
# SPDX-FileCopyrightText: 2026 japes98
#
# Licence information for files that can't carry an SPDX header.
# Checked by `reuse lint` in CI (C-REUSE).

version = 1

[[annotations]]
path = [
  "README.md",
  "NOTICE",
  ".gitmessage",
  "config/claude/*.json",
  "config/emulator-terms-reviewed.json",
  "audit/*.json",
  "config/budgets.json",
  "vendor/jieli-sdk/SHA256SUMS",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 japes98"
SPDX-License-Identifier = "MIT"

# Prompts are kept verbatim and transcripts are records; both quote SPDX
# tags in their text, so their contents are not parsed for licence tags.
[[annotations]]
path = [
  "docs/prompts/**",
  "sessions/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 japes98"
SPDX-License-Identifier = "MIT"

# Vendored JieLi AC79 SDK files, unmodified (vendor/jieli-sdk/SOURCE.md).
[[annotations]]
path = [
  "vendor/jieli-sdk/LICENSE",
  "vendor/jieli-sdk/include_lib/**",
]
precedence = "override"
SPDX-FileCopyrightText = "JIELI"
SPDX-License-Identifier = "Apache-2.0"

# Vendored Plaits and stmlib files, unmodified (vendor/plaits/SOURCE.md).
# Each carries the MIT notice in its header, without an SPDX tag.
[[annotations]]
path = [
  "vendor/plaits/eurorack/**",
  "vendor/plaits/stmlib/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2012-2021 Emilie Gillet"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["vendor/plaits/SHA256SUMS"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 japes98"
SPDX-License-Identifier = "MIT"

# Vendored emulator crates and their workspace manifest, from the public
# upstream at a pinned commit (vendor/emulator/UPSTREAM.md). The patch files
# quote upstream's manifest.
[[annotations]]
path = [
  "vendor/emulator/LICENSE",
  "vendor/emulator/Cargo.toml",
  "vendor/emulator/crates/**",
  "vendor/emulator/patches/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Joakim Eriksson"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["vendor/emulator/SHA256SUMS"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 japes98"
SPDX-License-Identifier = "MIT"

# The harness's generated and binary files: test images built from the
# sources beside them, golden outputs, test data, the lockfile.
[[annotations]]
path = [
  "harness/Cargo.lock",
  "harness/tests/images/*.bin",
  "harness/tests/images/SHA256SUMS",
  "harness/tests/golden/**",
  "harness/tests/data/**",
  "harness/spec-experiments/images/**",
  "harness/spec-experiments/golden/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 japes98"
SPDX-License-Identifier = "MIT"

# The firmware suite's golden files: outputs of fwtest, checked by hand
# when they were made (tests/fw/boot.suite).
[[annotations]]
path = ["tests/fw/golden/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 japes98"
SPDX-License-Identifier = "MIT"

# The owner's screenshot of the F-Emulator app's panel with its default
# labels, a source for docs/HARDWARE-SPEC.md (PROVENANCE P-12).
[[annotations]]
path = ["docs/sources/panel-app-default-labels.png"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 japes98"
SPDX-License-Identifier = "MIT"
