#
# Rediscovers the similarity audit's targets every month (R-AUDIT-2;
# docs/AUDIT.md, "Rediscovery"). tools/audit-discover.py reads repository
# metadata only, never a target's code. When a target is new, gone or has a
# new head commit, this opens an issue listing those repositories by name,
# or updates the one already open, and keeps the rewritten
# audit/targets.json as a run artifact. It cannot push or open pull
# requests: a spec-side session turns the issue into one.
name: audit-discover

on:
  schedule:
    - cron: "17 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-discover
  cancel-in-progress: false

jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Rediscover the targets (metadata only)
        id: discover
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python tools/audit-discover.py --write > "$RUNNER_TEMP/discover.txt"
          status=$?
          set -e
          cat "$RUNNER_TEMP/discover.txt"
          # 0: no change, 1: targets changed, anything else: the tool failed.
          [ "$status" -le 1 ] || exit "$status"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Keep the rewritten targets list
        if: steps.discover.outputs.status == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: targets
          path: audit/targets.json
          if-no-files-found: error
          retention-days: 90

      - name: Open or update the issue
        if: steps.discover.outputs.status == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "audit: the targets have changed"
        run: |
          set -eu
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "**What:** the monthly rediscovery of the similarity audit's targets (docs/AUDIT.md, \"Rediscovery\") found new, gone or moved repositories. It read repository metadata only."
            echo
            echo "**Run:** $run ($(date -u +%Y-%m-%d))"
            echo
            echo '```'
            cat "$RUNNER_TEMP/discover.txt"
            echo '```'
            echo
            echo "**For a spec-side session:** download this run's \`targets\` artifact (\`gh run download $GITHUB_RUN_ID -n targets\`), review any separation or privacy hit as docs/AUDIT.md says, and open a pull request that replaces \`audit/targets.json\` with it and closes this issue."
          } > "$RUNNER_TEMP/body.md"
          number=$(gh issue list --state open --author "app/github-actions" --search "in:title \"$TITLE\"" \
            --json number,title --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/body.md"
            gh issue comment "$number" --body "Updated by $run."
          else
            gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          fi
